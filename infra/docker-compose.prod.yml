# Production overlay (ADR 0006). Compose with the base file:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
# Caddy terminates TLS and is the ONLY published service; postgres/redis/backend/
# frontend host ports are removed (reachable only on the compose network).
services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits: { memory: 8G }
        reservations: { memory: 1G }

  redis:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }

  backend:
    restart: unless-stopped
    ports: !reset []  # reached via caddy on the internal network
    deploy:
      resources:
        limits: { memory: 6G }
        reservations: { memory: 1G }

  frontend:
    restart: unless-stopped
    ports: !reset []
    build:
      args:
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
